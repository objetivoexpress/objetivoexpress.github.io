<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetivo Express</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            padding: 4rem 2rem;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .container {
            max-width: 900px;
            margin: -2rem auto 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .card h2 {
            color: #1e3c72;
            margin-bottom: 1rem;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Objetivo Express</h1>
        <p>Seu site está no ar e funcionando perfeitamente!</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Bem-vindo ao seu novo projeto</h2>
            <p>O layout agora está estruturado e pronto para receber suas personalizações e imagens.</p>
        </div>
    </div>

    <footer>
        &copy; 2026 Objetivo Express. Todos os direitos reservados.
    </footer>

</body>
</html>
